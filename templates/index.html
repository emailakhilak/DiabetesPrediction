<!DOCTYPE html>
<html>

<head>
    <title>Diabetes Prediction</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Diabetes Prediction System</h1>

    <p class="subtitle">
        Enter health details below
    </p>

    <form action="/predict" method="post">

        <input
        type="number"
        name="Age"
        placeholder="Age"
        required>

        <input
        type="number"
        name="Glucose"
        placeholder="Glucose Level"
        required>

        <input
        type="number"
        step="0.1"
        name="BMI"
        placeholder="BMI"
        required>

        <button type="submit">
            Predict
        </button>

    </form>

</div>

</body>

</html>
